openapi: 3.0.0
info:
  title: Online Store API
  version: 0.0.0
tags: []
paths:
  /api/categories:
    get:
      operationId: listCategories
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /api/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/me:
    get:
      operationId: me
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /api/orders:
    post:
      operationId: createOrder
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/AddressRequired'
                  - $ref: '#/components/schemas/UnavailableItems'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
    get:
      operationId: listOrders
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
  /api/products:
    get:
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: q
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: priceMin
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: priceMax
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: available
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 6
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/products/{id}:
    get:
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
  /api/promos:
    get:
      operationId: listPromos
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promo'
  /api/session:
    post:
      operationId: login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
    delete:
      operationId: logout
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
  /api/users:
    post:
      operationId: register
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTaken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
components:
  schemas:
    AddressRequired:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/address-required
        title:
          type: string
        detail:
          type: string
    CartItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    EmailTaken:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/email-taken
        title:
          type: string
        detail:
          type: string
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    InternalError:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/internal-error
        title:
          type: string
        detail:
          type: string
    InvalidCredentials:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/invalid-credentials
        title:
          type: string
        detail:
          type: string
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int32
        currency:
          type: string
          default: RUB
    NotFound:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/not-found
        title:
          type: string
        detail:
          type: string
    Order:
      type: object
      required:
        - id
        - status
        - items
        - shipping
        - total
        - createdAt
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - paid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping:
          $ref: '#/components/schemas/ShippingDetails'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    OrderCreate:
      type: object
      required:
        - items
        - shipping
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          minItems: 1
        shipping:
          $ref: '#/components/schemas/ShippingDetails'
    OrderItem:
      type: object
      required:
        - productId
        - productName
        - priceAtPurchase
        - quantity
      properties:
        productId:
          type: string
        productName:
          type: string
        priceAtPurchase:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          format: int32
    PageMeta:
      type: object
      required:
        - page
        - perPage
        - total
        - totalPages
      properties:
        page:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
    ProblemType:
      type: string
      enum:
        - /problems/invalid-credentials
        - /problems/email-taken
        - /problems/address-required
        - /problems/unavailable-items
        - /problems/validation-error
        - /problems/unauthorized
        - /problems/not-found
        - /problems/internal-error
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - price
        - categoryId
        - available
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: string
        imageUrl:
          type: string
        available:
          type: boolean
    ProductPage:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Promo:
      type: object
      required:
        - id
        - title
        - text
        - product
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        product:
          $ref: '#/components/schemas/Product'
    ShippingDetails:
      type: object
      required:
        - method
        - recipientName
        - phone
      properties:
        method:
          type: string
          enum:
            - delivery
            - pickup
        recipientName:
          type: string
        phone:
          type: string
        address:
          type: string
    Unauthorized:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/unauthorized
        title:
          type: string
        detail:
          type: string
    UnavailableItems:
      type: object
      required:
        - type
        - title
        - unavailableProductIds
      properties:
        type:
          type: string
          enum:
            - /problems/unavailable-items
        title:
          type: string
        detail:
          type: string
        unavailableProductIds:
          type: array
          items:
            type: string
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
        email:
          type: string
    ValidationError:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum:
            - /problems/validation-error
        title:
          type: string
        detail:
          type: string
