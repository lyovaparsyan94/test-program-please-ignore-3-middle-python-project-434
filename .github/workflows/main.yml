name: main

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/appdb
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make install
      - run: make build
      - run: make lint
      - run: make test
