[project]
name = "hexlet-code"
version = "0.1.0"
description = "Online store backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.7",
    "sentry-sdk>=2.73.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
